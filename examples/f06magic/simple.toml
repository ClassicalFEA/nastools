[files]
mystran_all_elem = "examples/mystran/SB-ALL-ELEM-TEST.F06"
mystran_all_elem_giv = "examples/mystran/EB-ALL-ELEM-TEST-GIV.F06"
scnastran_all_elem = "examples/scnastran/SB-ALL-ELEM-TEST_scnas_postexport.f06"

[[extraction]]
name = "everything"

[[extraction]]
name = "nodal translations"
block = "displacements"
cols = ["tx", "ty", "tz"]

[[extraction]]
name = "translations on 1011,1012,1013"
block = "displacements"
nodes = [1011, 1012, 1013]
cols = ["tx", "ty", "tz"]

[[extraction]]
name = "1d elem stresses"
blocks = ["Elas1Stresses", "rod_stresses", "bar_stresses"]

[[extraction]]
name = "2d elem stresses"
blocks = ["tria_stresses", "quad_stresses"]

[[extraction]]
name = "bar axial+max stresses"
block = "bar_stresses"
cols = ["axial", "max_at_end_a", "max_at_end_b"]

[[extraction]]
name = "4th eigenvalue"
block = "eigenvalues"
cols = ["eigenvalue"]
raw_rows = 3

[[criteria]]
name = "must be equal"
max_difference = 0.0

[[criteria]]
name = "within 10%"
max_ratio = 1.1

[[comparison]]
name = "sb-all-elem, equal translations"
reference_f06 = "scnastran_all_elem"
test_f06 = "mystran_all_elem"
extraction = "nodal translations"
criteria = "must be equal"

[[comparison]]
name = "sb-all-elem, 1d/2d stresses within 10%"
reference_f06 = "scnastran_all_elem"
test_f06 = "mystran_all_elem"
extractions = ["1d elem stresses", "2d elem stresses"]
criteria = "within 10%"

[[check]]
name = "no translation on 1011, 1012, 1013"
file = "mystran_all_elem"
extraction = "translations on 1011,1012,1013"
all_equal = 0

[[check]]
name = "4th eigenvalue in range 2e5-3e5"
file = "mystran_all_elem_giv"
extraction = "4th eigenvalue"
all_in_range = [2e5, 3e5]
