[package]
name = "f06csv_web"
authors = ["Bruno Borges Paschoalinoto <bruno@paschoalinoto.com>"]
version = "0.6.0"
edition = "2021"
description = "Yew-based web UI for converting Nastran F06 output to CSV."

[lib]
crate-type = ["rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo = { version = "0.11", features = ["futures"] }
gloo-file = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
gloo-utils = "0.2"
log = "0.4"
wasm-logger = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
flate2 = "1.0"
base64 = "0.22"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "DataTransfer",
  "DragEvent",
  "Element",
  "File",
  "FileList",
  "FileReader",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "MediaQueryList",
  "Storage",
  "Url",
  "Window",
]

[dependencies.f06]
version = "0.6"
path = "../f06"
default-features = false

[dependencies.nas_csv]
version = "0.6"
path = "../nas_csv"
default-features = false
