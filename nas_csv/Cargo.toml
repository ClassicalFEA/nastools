[package]
name = "nas_csv"
authors = ["Bruno Borges Paschoalinoto <bruno@paschoalinoto.com>"]
version = "0.6.0"
edition = "2021"

[features]
default = ["clap"]
clap = ["dep:clap", "f06/clap"]

[dependencies]
clap = { version = "4.4", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
convert_case = "0.6"
derive_more = "0.99"

[dependencies.f06]
version = "0.6"
path = "../f06"
default-features = false
